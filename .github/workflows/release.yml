name: Publish npm release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable version tag to publish from the selected workflow ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.6.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Validate stable release version and tagged package source
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: node scripts/verify-release-source.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:release
      - run: pnpm format:check
      - run: pnpm exec playwright install --with-deps
      - run: pnpm test
      - run: pnpm build
      - name: Pack and verify the release artifact
        run: pnpm test:package --out-dir artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: |
            artifacts/*.tgz
            artifacts/release.json
            artifacts/publish-release.mjs
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: npm-tarball
          path: artifacts
      - name: Publish the verified tarball through npm trusted publishing
        run: node artifacts/publish-release.mjs artifacts/release.json
